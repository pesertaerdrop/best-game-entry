<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen Run — Pip's dash to the lighthouse</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1740; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Lumen Run: steer Pip the fox cub through three lanes, jump the rocks, slide under the brambles, dodge the boulders and catch fireflies on the 1000 metre run to the lighthouse"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
